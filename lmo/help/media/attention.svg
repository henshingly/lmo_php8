<svg xmlns="http://www.w3.org/2000/svg" width="61" height="15" viewBox="0 0 61 15">
  <!-- Rahmen -->
  <rect x="0.5" y="0.5" width="60" height="14" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <!-- Rotes Feld -->
  <rect x="2" y="2" width="18" height="11" fill="#990004"/>
  <!-- Ausrufezeichen -->
  <text x="11" y="11.2" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold"
        fill="#ffffff" text-anchor="middle" textLength="12" lengthAdjust="spacing">!!!</text>
  <!-- Schriftzug -->
  <text x="40.5" y="10.3" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="6.6" font-weight="bold"
        fill="#666666" text-anchor="middle" textLength="35" lengthAdjust="spacingAndGlyphs">ATTENTION</text>
</svg>
