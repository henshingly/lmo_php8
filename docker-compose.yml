# Aufruf siehe TESTING.md
services:
  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    image: lmo-golden-tests:php${PHP_VERSION:-8.3}
    volumes:
      - .:/app
      # unveraenderter Originalstand fuer das Aufzeichnen der Snapshots (optional)
      - ${ORIGINAL_DIR:-./.original}:/original:ro
    environment:
      LMO_SOURCE: ${LMO_SOURCE:-/app}
      GOLDEN_MODE: ${GOLDEN_MODE:-compare}
      GOLDEN_COVERAGE: ${GOLDEN_COVERAGE:-0}
      GOLDEN_NO_FAKETIME: ${GOLDEN_NO_FAKETIME:-0}

  # Statische Analyse mit PHPStan (siehe TESTING.md):  docker compose run --rm phpstan
  phpstan:
    extends:
      service: tests
    entrypoint: ["sh", "-c", "[ -x vendor/bin/phpstan ] || composer install --no-interaction --no-progress --prefer-dist; composer phpstan"]

  # Webserver zum Ausprobieren, arbeitet live auf ./lmo:  docker compose up -d web
  # Aufruf: http://localhost:${WEB_PORT:-8082}/lmo/
  # Addons mit Beispielligen ausprobieren: http://localhost:${WEB_PORT:-8082}/demo/
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    image: lmo-web:php${PHP_VERSION:-8.3}
    ports:
      - "${WEB_PORT:-8082}:80"
    volumes:
      - ./lmo:/var/www/html/lmo
      # Composer-Abhaengigkeiten liegen wie im Repo neben lmo/ (vorher: composer install bzw. docker compose run --rm tests)
      - ./vendor:/var/www/html/vendor:ro
      # Laufzeitdaten getrennt vom Code (Neustart von vorn: docker compose down -v)
      - ./lmo:/srv/lmo-src:ro
      - web-config:/var/www/html/lmo/config
      - web-ligen:/var/www/html/lmo/ligen
      - web-output:/var/www/html/lmo/output
      - web-tipps:/var/www/html/lmo/addon/tipp/tipps
      - web-stats:/var/www/html/lmo/addon/spieler/stats
      # Uebersichtsseite der Addons und Beispieldaten (werden beim Start in die Volumes kopiert)
      - ./docker/demo/index.php:/var/www/html/demo/index.php:ro
      - ./docker/demo:/srv/lmo-demo:ro
    environment:
      MAIL_PORT: ${MAIL_PORT:-8025}
    depends_on:
      - mail

  # Faengt alle Mails ab, die LMO im Web-Container verschickt (nichts geht nach draussen).
  # Postfach im Browser: http://localhost:${MAIL_PORT:-8025}/
  mail:
    image: axllent/mailpit
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  web-config:
  web-ligen:
  web-output:
  web-tipps:
  web-stats:
